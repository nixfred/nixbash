<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Safe NixBash customization model</title><desc id="d">The managed bashrc loads a separate local overrides file so machine-specific secrets and aliases survive updates.</desc><rect width="1200" height="350" rx="28" fill="#07121a"/><text x="55" y="62" fill="#eef7f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Managed defaults. Untouched local choices.</text><g font-family="system-ui,sans-serif"><rect x="55" y="115" width="390" height="160" rx="22" fill="#0b2526" stroke="#4ee0ba" stroke-width="2"/><rect x="755" y="115" width="390" height="160" rx="22" fill="#17172a" stroke="#9b86f2" stroke-width="2"/><text x="88" y="160" fill="#4ee0ba" font-family="ui-monospace,monospace" font-size="18" font-weight="700">~/.bashrc</text><text x="788" y="160" fill="#9b86f2" font-family="ui-monospace,monospace" font-size="18" font-weight="700">~/.bashrc_local</text><text x="88" y="205" fill="#eef7f8" font-size="22" font-weight="700">NixBash managed</text><text x="788" y="205" fill="#eef7f8" font-size="22" font-weight="700">Machine specific</text><text x="88" y="238" fill="#92a8ad" font-size="17">safe to refresh</text><text x="788" y="238" fill="#92a8ad" font-size="17">aliases · paths · secrets</text><path d="M470 195h250" stroke="#9b86f2" stroke-width="4"/><path d="m705 181 15 14-15 14" fill="none" stroke="#9b86f2" stroke-width="4"/><text x="595" y="176" text-anchor="middle" fill="#92a8ad" font-size="16">sources</text></g><text x="600" y="320" text-anchor="middle" fill="#7e939a" font-family="ui-monospace,monospace" font-size="17">Updates do not overwrite your local override file.</text></svg>
