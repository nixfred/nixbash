<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d"><title id="t">NixBash terminal environment</title><desc id="d">A clean Linux terminal dashboard showing server health, a concise prompt, and modern command-line tools.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121b"/><stop offset="1" stop-color="#111529"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="660" rx="34" fill="url(#bg)"/><rect x="95" y="72" width="1410" height="515" rx="28" fill="#091018" stroke="#274150" stroke-width="3"/><circle cx="135" cy="112" r="10" fill="#f06a6a"/><circle cx="170" cy="112" r="10" fill="#e7b84b"/><circle cx="205" cy="112" r="10" fill="#52d58b"/><g font-family="ui-monospace,monospace"><text x="150" y="200" fill="#58e0bd" font-size="42" font-weight="700">NIXBASH // SERVER READY</text><g fill="#8fa7b6" font-size="25"><text x="150" y="255">host  atlas-01</text><text x="150" y="296">uptime  14d 07h</text><text x="150" y="337">load  0.18  ·  memory  31%  ·  disk  42%</text><text x="150" y="378">tailscale  online  ·  docker  8 running</text></g><text x="150" y="458" fill="#62dc91" font-size="30">fred</text><text x="230" y="458" fill="#f0c45b" font-size="30">@atlas-01</text><text x="420" y="458" fill="#62bff0" font-size="30">~/projects</text><text x="610" y="458" fill="#55e2c0" font-size="30">›</text><rect x="648" y="434" width="18" height="31" fill="#55e2c0" filter="url(#g)"/><g fill="#9b86f2" font-size="23"><text x="1020" y="238">eza  ·  bat  ·  fzf</text><text x="1020" y="282">zoxide  ·  rg  ·  btop</text><text x="1020" y="326">fastfetch  ·  ncdu</text></g></g><text x="800" y="628" text-anchor="middle" fill="#758d9b" font-family="system-ui,sans-serif" font-size="22">FROM FRESH SERVER TO A SHELL THAT FEELS LIKE YOURS</text></svg>
