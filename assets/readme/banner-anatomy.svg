<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">NixBash login banner anatomy</title><desc id="d">The login banner surfaces identity, network, health, services, and security signals while skipping heavy checks over SSH.</desc><rect width="1200" height="380" rx="28" fill="#07121a"/><text x="55" y="62" fill="#eef7f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Know the server before the first command.</text><g font-family="system-ui,sans-serif"><g fill="#0d2028" stroke="#294451" stroke-width="2"><rect x="55" y="110" width="250" height="190" rx="20"/><rect x="335" y="110" width="250" height="190" rx="20"/><rect x="615" y="110" width="250" height="190" rx="20"/><rect x="895" y="110" width="250" height="190" rx="20"/></g><g fill="#4ee0ba" font-family="ui-monospace,monospace" font-size="17" font-weight="700"><text x="82" y="151">IDENTITY</text><text x="362" y="151">HEALTH</text><text x="642" y="151">SERVICES</text><text x="922" y="151">SECURITY</text></g><g fill="#eef7f8" font-size="21" font-weight="700"><text x="82" y="195">host + IPs</text><text x="362" y="195">load + memory</text><text x="642" y="195">Tailscale + Docker</text><text x="922" y="195">SSH failures</text></g><g fill="#92a8ad" font-size="17"><text x="82" y="231">uptime + timezone</text><text x="362" y="231">disk + temperature</text><text x="642" y="231">fast status checks</text><text x="922" y="231">fail2ban signal</text></g></g><text x="600" y="340" text-anchor="middle" fill="#7e939a" font-family="ui-monospace,monospace" font-size="17">Heavy checks are skipped on SSH connections to keep remote startup fast.</text></svg>
