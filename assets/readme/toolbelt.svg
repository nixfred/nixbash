<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">NixBash modern CLI toolbelt</title><desc id="d">Modern tools cover navigation, files, search, monitoring, system information, and disk usage.</desc><rect width="1200" height="390" rx="28" fill="#07121a"/><text x="55" y="62" fill="#eef7f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">A modern toolbelt, installed automatically.</text><g font-family="ui-monospace,monospace" text-anchor="middle"><g fill="#0d2028" stroke="#3c5b65" stroke-width="2"><rect x="55" y="110" width="200" height="100" rx="18"/><rect x="275" y="110" width="200" height="100" rx="18"/><rect x="495" y="110" width="200" height="100" rx="18"/><rect x="715" y="110" width="200" height="100" rx="18"/><rect x="935" y="110" width="210" height="100" rx="18"/><rect x="165" y="235" width="200" height="100" rx="18"/><rect x="385" y="235" width="200" height="100" rx="18"/><rect x="605" y="235" width="200" height="100" rx="18"/><rect x="825" y="235" width="200" height="100" rx="18"/></g><g fill="#58dfbd" font-size="24" font-weight="700"><text x="155" y="162">eza</text><text x="375" y="162">bat</text><text x="595" y="162">fzf</text><text x="815" y="162">zoxide</text><text x="1040" y="162">ripgrep</text><text x="265" y="287">btop</text><text x="485" y="287">fastfetch</text><text x="705" y="287">ncdu</text><text x="925" y="287">tree</text></g><g fill="#8fa5aa" font-size="15"><text x="155" y="190">list</text><text x="375" y="190">view</text><text x="595" y="190">find</text><text x="815" y="190">navigate</text><text x="1040" y="190">search</text><text x="265" y="315">monitor</text><text x="485" y="315">inspect</text><text x="705" y="315">disk</text><text x="925" y="315">structure</text></g></g></svg>
