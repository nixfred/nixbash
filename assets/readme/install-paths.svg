<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Two NixBash installation paths</title><desc id="d">Automatic mode installs only the shell without prompts; interactive root mode guides full server provisioning.</desc><rect width="1200" height="350" rx="28" fill="#07121a"/><text x="55" y="62" fill="#eef7f8" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Pick the size of the job.</text><g font-family="system-ui,sans-serif"><rect x="55" y="108" width="520" height="190" rx="22" fill="#0b2526" stroke="#4ee0ba" stroke-width="2"/><rect x="625" y="108" width="520" height="190" rx="22" fill="#15172a" stroke="#9b86f2" stroke-width="2"/><g font-family="ui-monospace,monospace" font-size="17" font-weight="700"><text x="86" y="149" fill="#4ee0ba">AUTOMATIC</text><text x="656" y="149" fill="#9b86f2">INTERACTIVE</text></g><g fill="#eef7f8" font-size="25" font-weight="700"><text x="86" y="193">Shell environment</text><text x="656" y="193">Full server setup</text></g><g fill="#99acad" font-size="18"><text x="86" y="230">no prompts · no root required</text><text x="656" y="230">guided · root provisioning</text><text x="86" y="261">safe for scripted installs</text><text x="656" y="261">users, SSH, Docker, hardening</text></g></g></svg>
